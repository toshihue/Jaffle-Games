version: 2

models:
  # ------------------------------------------------------------------------------------
  - name: stg_platforms
    description: 整形済みストアフロント参照。1行が1プラットフォームを表す。
    columns:
      - name: platform_id
        description: ストアフロント識別子（主キー）。
        data_tests:
          - unique
          - not_null
      - name: platform_family
        description: pc、console、mobileのいずれかのプラットフォーム種別。
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['pc', 'console', 'mobile']

      - name: storefront_fee_rate
        description: ストアフロントが保持する売上総額の割合。
        data_tests:
          - not_null

  # ------------------------------------------------------------------------------------
  - name: stg_titles
    description: 整形済みタイトルディメンション。1行が1ゲームを表し、型変換とテキストのトリミングを行う。
    columns:
      - name: title_id
        description: タイトルの主キー。
        data_tests:
          - unique
          - not_null
      - name: title_name
        description: プレイヤー向けのタイトル名。
        data_tests:
          - not_null
      - name: monetization_model
        description: premium、f2p、premium_plus_dlcのいずれかの収益化モデル。
        data_tests:
          - accepted_values:
              arguments:
                values: ['premium', 'f2p', 'premium_plus_dlc']
      - name: launch_date
        description: 全世界での発売日。
        data_tests:
          - not_null
      - name: is_live_service
        description: タイトルがライブサービス型ゲームとして運営されているか。
        data_tests:
          - not_null

  # ------------------------------------------------------------------------------------
  - name: stg_title_platforms
    description: 整形済みタイトルとプラットフォームの発売ブリッジ。
    columns:
      - name: title_id
        description: stg_titlesへの外部キー。
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_titles')
                field: title_id
      - name: platform_id
        description: stg_platformsへの外部キー。
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_platforms')
                field: platform_id
      - name: platform_launch_date
        description: プラットフォームごとの発売日。
        data_tests:
          - not_null
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [title_id, platform_id]

  # ------------------------------------------------------------------------------------
  - name: stg_skus
    description: 整形済みSKUディメンション。1行が1つの購入可能アイテムを表す。
    columns:
      - name: sku_id
        description: SKUの主キー。
        data_tests:
          - unique
          - not_null
      - name: title_id
        description: stg_titlesへの外部キー。
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_titles')
                field: title_id
      - name: sku_category
        description: cosmetic、currency_pack、expansion、battle_passのいずれかのSKUカテゴリ。
        data_tests:
          - accepted_values:
              arguments:
                values: ['cosmetic', 'currency_pack', 'expansion', 'battle_pass']
      - name: price_usd
        description: SKUの定価（USD）。
        data_tests:
          - not_null

  # ------------------------------------------------------------------------------------
  - name: stg_players
    description: >
      整形済みプレイヤーディメンション。国コードをトリミングして大文字化し、獲得チャネルを正規化する。
      生データの「Paid Social」はpaid_socialに統合される。
    columns:
      - name: player_id
        description: プレイヤーの主キー。
        data_tests:
          - unique
          - not_null
      - name: registered_at
        description: 登録タイムスタンプ（UTC）。
        data_tests:
          - not_null
      - name: acquisition_channel
        description: 正規化済みの獲得チャネル。
        data_tests:
          - accepted_values:
              arguments:
                values: ['organic', 'paid_social', 'influencer', 'store_featured', 'cross_promo']
      - name: account_status
        description: active、dormant、churned、bannedのいずれかのアカウント状態。
        data_tests:
          - accepted_values:
              arguments:
                values: ['active', 'dormant', 'churned', 'banned']
      - name: acquisition_campaign_id
        description: プレイヤーを獲得したキャンペーン。広告経由の場合に設定され、nullの場合がある。
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_marketing_spend')
                field: campaign_id
              config:
                where: "acquisition_campaign_id is not null"

  # ------------------------------------------------------------------------------------
  - name: stg_releases
    description: 整形済みリリース履歴。1行が1つのパッチまたはコンテンツドロップを表す。
    columns:
      - name: release_id
        description: リリースの主キー。
        data_tests:
          - unique
          - not_null
      - name: title_id
        description: stg_titlesへの外部キー。
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_titles')
                field: title_id
      - name: release_type
        description: major、minor、hotfix、content_drop、eventのいずれかのリリース種別。
        data_tests:
          - accepted_values:
              arguments:
                values: ['major', 'minor', 'hotfix', 'content_drop', 'event']
      - name: released_at
        description: リリースタイムスタンプ（UTC）。
        data_tests:
          - not_null

  # ------------------------------------------------------------------------------------
  - name: stg_play_sessions
    description: >
      整形済みセッションイベント。生フィードに3件の重複行があるため、session_idごとに1行へ重複排除する。
      国コードを整形し、終了時刻がnullの行と時間の外れ値は保持したまま、fct_play_sessionsで業務ロジックとして処理する。
    columns:
      - name: session_id
        description: セッションの主キー（重複排除後は一意）。
        data_tests:
          - unique
          - not_null
      - name: player_id
        description: stg_playersへの外部キー。
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_players')
                field: player_id
      - name: title_id
        description: stg_titlesへの外部キー。
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_titles')
                field: title_id
      - name: platform_id
        description: stg_platformsへの外部キー。
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_platforms')
                field: platform_id
      - name: network_type
        description: セッションで使用されたネットワーク。
        data_tests:
          - accepted_values:
              arguments:
                values: ['wifi', 'cellular', 'ethernet']
      - name: session_start_at
        description: セッション開始時刻（UTC）。
        data_tests:
          - not_null

  # ------------------------------------------------------------------------------------
  - name: stg_transactions
    description: >
      整形済み取引。transaction_atはAmerica/New_YorkからUTCへ変換し、元の現地時刻をtransaction_at_localとして保持する。
      金額は正数のまま保持し、符号の正規化はint_transactionsで行う。
    columns:
      - name: transaction_id
        description: 取引の主キー。
        data_tests:
          - unique
          - not_null
      - name: player_id
        description: stg_playersへの外部キー。
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_players')
                field: player_id
      - name: title_id
        description: stg_titlesへの外部キー。
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_titles')
                field: title_id
      - name: sku_id
        description: stg_skusへの外部キー。プレミアムの本体購入ではnull。
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_skus')
                field: sku_id
              config:
                where: "sku_id is not null"
      - name: transaction_type
        description: premium_purchase、iap、season_pass、dlc、refund、chargebackのいずれかの取引種別。
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['premium_purchase', 'iap', 'season_pass', 'dlc', 'refund', 'chargeback']
      - name: payment_method
        description: 使用された決済手段。
        data_tests:
          - accepted_values:
              arguments:
                values: ['card', 'paypal', 'apple_pay', 'google_play', 'platform_wallet']

      - name: gross_amount_usd
        description: 売上総額（USD、正数）。
        data_tests:
          - not_null

  # ------------------------------------------------------------------------------------
  - name: stg_high_scores
    description: 整形済みリーダーボード投稿。
    columns:
      - name: score_id
        description: 投稿の主キー。
        data_tests: [unique, not_null]
      - name: player_id
        description: stg_playersへの外部キー。
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_players')
                field: player_id
      - name: title_id
        description: stg_titlesへの外部キー。
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_titles')
                field: title_id

  # ------------------------------------------------------------------------------------
  - name: stg_reviews
    description: 整形済みストアレビュー。
    columns:
      - name: review_id
        description: レビューの主キー。
        data_tests: [unique, not_null]
      - name: player_id
        description: stg_playersへの外部キー。
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_players')
                field: player_id
      - name: title_id
        description: stg_titlesへの外部キー。
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_titles')
                field: title_id
      - name: rating
        description: 星評価（1〜5）。
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5]
                quote: false

  # ------------------------------------------------------------------------------------
  - name: stg_marketing_spend
    description: 整形済みの週次マーケティング費用と獲得ファネル。
    columns:
      - name: campaign_id
        description: キャンペーン識別子（キャンペーン週ごとに1行のため一意ではない）。
        data_tests: [not_null]
      - name: title_id
        description: stg_titlesへの外部キー。
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_titles')
                field: title_id
      - name: channel
        description: 有料獲得チャネル。
        data_tests:
          - accepted_values:
              arguments:
                values: ['paid_social', 'influencer', 'store_featured', 'cross_promo']
      - name: week_start_date
        description: 月曜日始まりの費用集計週。
        data_tests: [not_null]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [campaign_id, week_start_date]

unit_tests:
  - name: test_stg_players_cleans_dirty_inputs
    config:
      compute: local
    description: >
      country_code is trimmed/uppercased with empty strings turned to null; acquisition_channel
      collapses "Paid Social" and "paid_social" into the same normalized value; a blank
      acquisition_campaign_id becomes null instead of an empty string.
    model: stg_players
    given:
      - input: ref('raw_players')
        rows:
          - {player_id: p1, country_code: " us ", acquisition_channel: "Paid Social", acquisition_campaign_id: " camp1 ", registered_at: "2026-01-01 00:00:00", platform_registered_on: steam, birth_year: 1990, email: " Test@Example.com ", marketing_opt_in: true,  account_status: active,  last_login_at: "2026-01-02 00:00:00", _loaded_at: "2026-01-02 00:00:00"}
          - {player_id: p2, country_code: "",     acquisition_channel: "paid_social",  acquisition_campaign_id: "",         registered_at: "2026-01-01 00:00:00", platform_registered_on: steam, birth_year: 1991, email: "a@b.com",              marketing_opt_in: false, account_status: dormant, last_login_at: "2026-01-02 00:00:00", _loaded_at: "2026-01-02 00:00:00"}
          - {player_id: p3, country_code: "De",   acquisition_channel: "organic",      acquisition_campaign_id: null,       registered_at: "2026-01-01 00:00:00", platform_registered_on: steam, birth_year: 1992, email: "c@d.com",              marketing_opt_in: true,  account_status: active,  last_login_at: "2026-01-02 00:00:00", _loaded_at: "2026-01-02 00:00:00"}
    expect:
      rows:
        - {player_id: p1, country_code: US,   acquisition_channel: paid_social, acquisition_campaign_id: camp1, email_address: "test@example.com"}
        - {player_id: p2, country_code: null, acquisition_channel: paid_social, acquisition_campaign_id: null,  email_address: "a@b.com"}
        - {player_id: p3, country_code: DE,   acquisition_channel: organic,     acquisition_campaign_id: null,  email_address: "c@d.com"}

  - name: test_stg_play_sessions_dedupes_on_session_id
    description: >
      The raw feed carries duplicate session_id rows; only one survives per session_id
      (earliest by loaded_at, then session_start_at), so downstream grain is truly one
      row per session.
    model: stg_play_sessions
    given:
      - input: ref('raw_play_sessions')
        rows:
          - {session_id: s1, player_id: p1, title_id: t1, platform: steam, session_start_at: "2026-01-01 09:00:00", session_end_at: "2026-01-01 09:10:00", duration_seconds: 600, device_model: iPhone14,                    app_version: "1.0.0", country_code: us, levels_completed: 1, crashed_flag: false, network_type: wifi,     _loaded_at: "2026-01-01 00:00:00"}
          - {session_id: s1, player_id: p1, title_id: t1, platform: steam, session_start_at: "2026-01-01 09:00:00", session_end_at: "2026-01-01 09:10:00", duration_seconds: 600, device_model: DUPLICATE_SHOULD_BE_DROPPED, app_version: "1.0.0", country_code: us, levels_completed: 1, crashed_flag: false, network_type: wifi,     _loaded_at: "2026-01-02 00:00:00"}
          - {session_id: s2, player_id: p2, title_id: t2, platform: xbox,  session_start_at: "2026-01-03 09:00:00", session_end_at: "2026-01-03 09:05:00", duration_seconds: 300, device_model: Pixel7,                     app_version: "2.0.0", country_code: de, levels_completed: 2, crashed_flag: false, network_type: cellular, _loaded_at: "2026-01-01 00:00:00"}
    expect:
      rows:
        - {session_id: s1, device_model: iPhone14}
        - {session_id: s2, device_model: Pixel7}
