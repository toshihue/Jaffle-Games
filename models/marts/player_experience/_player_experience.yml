version: 2

models:
  - name: mart_player_retention
    description: >
      登録コホート×獲得チャネル×週次オフセットのコホートリテンション三角表。
      各行にコホートサイズを持つため、率を常にその分母に対して解釈できる。
      is_observableは対象週がまだ完全に経過していないセルを示す。コホートの離脱箇所や
      organicとpaid_socialの品質比較に利用する。
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [registration_cohort_month, acquisition_channel, week_offset]
    columns:
      - name: registration_cohort_month
        description: コホートが登録した月。
        data_tests: [not_null]
      - name: acquisition_channel
        description: コホートの獲得チャネル別区分。
        data_tests:
          - accepted_values:
              arguments:
                values: ['organic', 'paid_social', 'influencer', 'store_featured', 'cross_promo']
      - name: week_offset
        description: 登録からの経過週数（0は登録週）。
        data_tests: [not_null]
      - name: cohort_size
        description: コホート・チャネルのプレイヤー数。行内のすべての率の分母。
      - name: retained_players
        description: この週次オフセットでアクティブだったコホート・チャネルの重複しないプレイヤー数。
      - name: is_observable
        description: >
          分析基準日時点で対象週が完全に経過している場合にtrue。falseの場合はまだ測定できず、
          retention_rateはnullとなる（新しいコホートを離脱とは扱わない）。
      - name: retention_rate
        description: 継続プレイヤー数をコホートサイズで割った割合（0〜1）。観測不能なセルではnull。

  - name: mart_player_leaderboard
    description: >
      タイトル横断のプレイヤーランキング。各プレイヤーのリーダーボードごとの最高正当スコアと、
      リーダーボード内および全体の順位・パーセンタイルを持つ。不正フラグ付き投稿は順位から除外し、
      アンチチート可視化のためflagged_submissionsには計上する。
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [player_id, leaderboard_id]
    columns:
      - name: player_id
        description: ランキングが属するプレイヤー。
        data_tests:
          - not_null
          - relationships:
              arguments: { to: ref('dim_players'), field: player_id }
      - name: title_id
        description: リーダーボードが属するタイトル。
        data_tests:
          - relationships:
              arguments: { to: ref('dim_titles'), field: title_id }
      - name: leaderboard_id
        description: ランキング対象のリーダーボード。
        data_tests: [not_null]
      - name: best_score
        description: リーダーボードにおけるプレイヤーの最高正当スコア（不正フラグなし）。
      - name: legit_submissions
        description: プレイヤーのリーダーボードへの正当な投稿数。
      - name: flagged_submissions
        description: 不正フラグ付きでランキングから除外された投稿数。
      - name: rank_in_leaderboard
        description: リーダーボード内でのプレイヤー最高スコアの順位（1が最上位、正当スコアのみ）。
      - name: leaderboard_player_count
        description: リーダーボードで順位付けされた正当プレイヤー数。順位の分母。
      - name: percentile_in_leaderboard
        description: リーダーボード内でのプレイヤー最高スコアのパーセンタイル（0〜1）。
      - name: percentile_global
        description: 全リーダーボードを通じたプレイヤー最高スコアのパーセンタイル（0〜1）。
