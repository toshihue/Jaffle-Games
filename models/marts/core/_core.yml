version: 2

models:
  # ====================================================================================
  # DIMENSIONS
  # ====================================================================================
  - name: dim_platforms
    description: 整合済みプラットフォームディメンション。1行が1ストアフロントを表し、手数料の経済性を持つ。

    columns:
      - name: platform_id
        description: ストアフロント識別子（主キー）。
        data_type: varchar
        data_tests: [unique, not_null]
      - name: platform_family
        description: ストアフロントの種別（pc、console、mobile）。ポートフォリオ分析で主に使用する分類。
        data_type: varchar
      - name: storefront_fee_rate
        description: ストアフロントが保持する売上総額の割合。スタジオ純収益の算定要素。
        data_type: number(4,3)

  # ------------------------------------------------------------------------------------
  - name: dim_skus
    description: 整合済みSKUディメンション。1行が1つの購入可能アイテムと所属タイトルを表す。
    config:
      contract:
        enforced: true
    columns:
      - name: sku_id
        description: SKU識別子（主キー）。
        data_type: varchar
        constraints: [type: not_null]
        data_tests: [unique, not_null]
      - name: title_id
        description: SKUが属するタイトル。
        data_type: varchar
        data_tests:
          - relationships:
              arguments: {to: ref('dim_titles'), field: title_id}
      - name: title_name
        description: 利便性のため非正規化したSKU所属タイトル名。
        data_type: varchar
      - name: sku_name
        description: プレイヤー向けストア上のアイテム名。
        data_type: varchar
      - name: sku_category
        description: アイテム種別。cosmetic、currency_pack、expansion、battle_passのいずれか。
        data_type: varchar
        data_tests:
          - accepted_values:
              arguments:
                values: ['cosmetic', 'currency_pack', 'expansion', 'battle_pass']

      - name: price_usd
        description: アイテムの現在の定価（USD）。
        data_type: number(12,2)
      - name: is_active
        description: アイテムが現在販売可能か。
        data_type: boolean
      - name: first_available_date
        description: アイテムが初めて販売された日付。
        data_type: date
      - name: legacy_sku_id
        description: 移行前のアイテムのストアフロントID。過去の取引との結合用に保持する。
        data_type: varchar

  # ------------------------------------------------------------------------------------
  - name: dim_dates
    description: >
      履歴期間とその後90日をカバーする日付スパイン。活動がない月や週を欠落させず、
      時系列マートに表示できる。
    config:
      contract:
        enforced: true
    time_spine:
      standard_granularity_column: date_day
    columns:
      - name: date_day
        description: 暦日（主キー）。
        data_type: date
        constraints: [type: not_null]
        data_tests: [unique, not_null]
        granularity: day
      - name: year_number
        description: 暦年。
        data_type: integer
      - name: quarter_number
        description: 暦四半期（1〜4）。
        data_type: integer
      - name: month_number
        description: 暦月（1〜12）。
        data_type: integer
      - name: month_name
        description: 月の正式名称。
        data_type: varchar
      - name: day_of_month
        description: 月内の日（1〜31）。
        data_type: integer
      - name: day_of_week_iso
        description: ISO曜日番号（1＝月曜日、7＝日曜日）。
        data_type: integer
      - name: day_name
        description: 曜日の正式名称。
        data_type: varchar
      - name: is_weekend
        description: 土曜日または日曜日の場合にtrue。週末エンゲージメント上昇の分析に使用する。
        data_type: boolean
      - name: week_start_date
        description: 月曜日始まりの週の開始日。
        data_type: date
      - name: month_start_date
        description: 月の初日。
        data_type: date
      - name: quarter_start_date
        description: 四半期の初日。
        data_type: date
      - name: is_within_history_window
        description: 当日がseedされた12か月の履歴期間内にある場合にtrue。
        data_type: boolean

  # ------------------------------------------------------------------------------------
  - name: dim_titles
    description: >
      整合済みタイトルディメンションと算出ライフサイクル段階。タイトルの経過期間と直近エンゲージメントを
      組み合わせ、launch、growth、mature、declining、sunset_candidateの状態を経営層が把握できる。
    config:
      contract:
        enforced: true
    columns:
      - name: title_id
        description: タイトル識別子（主キー）。
        data_type: varchar
        constraints: [type: not_null]
        data_tests: [unique, not_null]
      - name: title_name
        description: プレイヤー向けのタイトル名。
        data_type: varchar
        data_tests: [not_null]
      - name: genre
        description: タイトルの主要ジャンル。
        data_type: varchar
      - name: sub_genre
        description: より詳細なサブジャンル。
        data_type: varchar
      - name: monetization_model
        description: タイトルの収益化方式。premium、f2p、premium_plus_dlcのいずれか。
        data_type: varchar
        data_tests:
          - accepted_values:
              arguments:
                values: ['premium', 'f2p', 'premium_plus_dlc']

      - name: is_live_service
        description: タイトルが継続運営型のライブサービスゲームか。
        data_type: boolean
      - name: launch_date
        description: 全世界での発売日。
        data_type: date
      - name: list_price_usd
        description: 現在のプレミアム定価（無料プレイの場合は0）。
        data_type: number(12,2)
      - name: internal_team
        description: タイトルを担当するスタジオチーム。
        data_type: varchar
      - name: engine
        description: タイトルが動作するゲームエンジン。
        data_type: varchar
      - name: esrb_rating
        description: ESRBコンテンツレーティング。
        data_type: varchar
      - name: sunset_date
        description: タイトルを正式終了した日付。現行タイトルはnull。
        data_type: date
      - name: days_since_launch
        description: 発売日から分析基準日までの日数。ライフサイクルの経過期間軸。
        data_type: integer
      - name: platform_count
        description: タイトルが発売されているストアフロント数。
        data_type: integer
      - name: earliest_platform_launch_date
        description: 記録上の最も早いプラットフォーム別発売日。
        data_type: date
      - name: lifecycle_stage
        description: >
          算出された段階。launch_window（発売から90日以内）、growth、mature、declining、
          sunset_candidate（60日以上プレイされていない経過タイトル）のいずれか。投資判断に使用する。
        data_type: varchar
        data_tests:
          - accepted_values:
              arguments:
                values: ['launch_window', 'growth', 'mature', 'declining', 'sunset_candidate']

      - name: lifetime_sessions
        description: 履歴期間内にタイトルで記録された全セッション数。
        data_type: integer
      - name: lifetime_players
        description: タイトルをプレイした重複しないプレイヤー数。
        data_type: integer
      - name: first_session_at
        description: 最も早い記録済みセッションのタイムスタンプ。
        data_type: timestamp_ntz
      - name: last_session_at
        description: 最新の記録済みセッションのタイムスタンプ。終了判断の最新活動シグナル。
        data_type: timestamp_ntz
      - name: days_since_last_session
        description: 分析基準日時点でタイトルが最後にプレイされてからの日数。
        data_type: integer
      - name: sessions_last_60d
        description: 直近60日間のセッション数。ほぼ0の場合は停滞タイトルの兆候。
        data_type: integer
      - name: active_players_last_90d
        description: 直近90日間にアクティブだった重複しないプレイヤー数。
        data_type: integer
      - name: avg_review_rating
        description: タイトルの全レビューにおけるストア平均評価（1〜5）。
        data_type: number(4,2)
      - name: review_count
        description: 記録されているストアレビュー数。
        data_type: integer
      - name: recommend_rate
        description: タイトルを推奨するレビューの割合（0〜1）。
        data_type: number(5,4)

  # ------------------------------------------------------------------------------------
  - name: dim_players
    description: >
      整合済みプレイヤーディメンション。1行が1登録アカウントを表し、獲得、ライフサイクル、
      エンゲージメント、収益化属性を持つ。payer_segmentはライブサービス支出のみを反映し、
      is_churnedはセッションの最新性に基づく行動指標で、元のaccount_statusとは異なる。
    config:
      contract:
        enforced: true
    columns:
      - name: player_id
        description: プレイヤー識別子（主キー）。
        data_type: varchar
        constraints: [type: not_null]
        data_tests: [unique, not_null]
      - name: registered_at
        description: アカウント登録タイムスタンプ（UTC）。
        data_type: timestamp_ntz
        data_tests: [not_null]
      - name: registration_cohort_month
        description: プレイヤーが登録した月。リテンション分析のコホートキー。
        data_type: date
      - name: country_code
        description: 整形済みアカウントISO国コード。
        data_type: varchar
      - name: platform_registered_on_id
        description: アカウントが最初に登録されたストアフロント。
        data_type: varchar
      - name: acquisition_channel
        description: プレイヤーを獲得した正規化チャネル。CACとチャネル別リテンションの分析軸。
        data_type: varchar
        data_tests:
          - accepted_values:
              arguments:
                values: ['organic', 'paid_social', 'influencer', 'store_featured', 'cross_promo']
      - name: acquisition_campaign_id
        description: プレイヤーを獲得した有料キャンペーン（存在する場合）。
        data_type: varchar
      - name: birth_year
        description: 自己申告の出生年。
        data_type: integer
      - name: age_years
        description: 出生年から算出した分析基準日時点のプレイヤー年齢。
        data_type: integer
      - name: marketing_opt_in
        description: プレイヤーがマーケティング連絡に同意したか。
        data_type: boolean
      - name: account_status
        description: 元システムのアカウント状態。active、dormant、churned、bannedのいずれか。
        data_type: varchar
        data_tests:
          - accepted_values:
              arguments:
                values: ['active', 'dormant', 'churned', 'banned']
      - name: last_login_at
        description: 最新ログインタイムスタンプ（UTC）。
        data_type: timestamp_ntz
      - name: lifetime_sessions
        description: プレイヤーがプレイした全セッション数。
        data_type: integer
      - name: lifetime_valid_sessions
        description: クラッシュとアイドル状態の外れ値を除外したセッション数。クリーンなエンゲージメントの分母。
        data_type: integer
      - name: lifetime_play_minutes
        description: 有効な総プレイ時間（分）。
        data_type: number(12,2)
      - name: distinct_titles_played
        description: プレイヤーがプレイした重複しないタイトル数。
        data_type: integer
      - name: first_session_at
        description: プレイヤーの最初のセッションのタイムスタンプ。
        data_type: timestamp_ntz
      - name: last_session_at
        description: プレイヤーの最新セッションのタイムスタンプ。
        data_type: timestamp_ntz
      - name: days_since_last_session
        description: 分析基準日時点でプレイヤーが最後にプレイしてからの日数。
        data_type: integer
      - name: favorite_title_id
        description: プレイヤーのセッション数が最も多いタイトル。
        data_type: varchar
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_titles')
                field: title_id
              config: {where: "favorite_title_id is not null"}
      - name: favorite_title_name
        description: プレイヤーが最も多くプレイしたタイトル名。
        data_type: varchar
      - name: primary_platform_id
        description: プレイヤーが最も多く利用するストアフロント。
        data_type: varchar
      - name: live_service_net_usd
        description: 生涯ライブサービス支出（iap＋season_pass、取消取引控除後）。payer_segmentの基礎。
        data_type: number(12,2)
      - name: lifetime_net_revenue_usd
        description: 全ストリーム（premium、iap、season、dlc、取消取引控除後）におけるプレイヤーの生涯純収益。
        data_type: number(12,2)
      - name: lifetime_studio_net_usd
        description: ストアフロント手数料控除後の生涯収益。スタジオが実際に保持する金額。
        data_type: number(12,2)
      - name: payer_segment
        description: >
          生涯iap＋season_pass支出から算出したライブサービス課金階層。whale、dolphin、minnow、
          non_payerのいずれか。non_payerでもプレミアムタイトルやDLCを購入している場合がある。
        data_type: varchar
        data_tests:
          - accepted_values:
              arguments:
                values: ['whale', 'dolphin', 'minnow', 'non_payer']

      - name: is_payer
        description: プレイヤーに生涯ライブサービス支出がある場合にtrue。
        data_type: boolean
      - name: first_purchase_at
        description: プレイヤーの初回獲得取引のタイムスタンプ（存在する場合）。
        data_type: timestamp_ntz
      - name: is_churned
        description: >
          行動ベースの離脱フラグ。分析基準日時点でプレイヤーの最終セッションが離脱閾値
          （{{ var('churn_days_threshold') }}日）より古い場合にtrue。
        data_type: boolean

  # ====================================================================================
  # FACTS
  # ====================================================================================
  - name: fct_play_sessions
    description: >
      1行が1プレイセッションを表す。時間、妥当性、セッション時点で適用されたリリース、
      リテンション分析用の登録からの週次オフセットを持つ中核エンゲージメントファクト。
      セッションファクト上のエンゲージメントセマンティックモデル。
    config:
      contract:
        enforced: true
    columns:
      - name: session_id
        description: セッション識別子（主キー、上流で重複排除済み）。
        data_type: varchar
        constraints: [type: not_null]
        data_tests: [unique, not_null]
        entity:
          type: primary
          name: session
      - name: player_id
        description: セッションをプレイしたプレイヤー。
        data_type: varchar
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('dim_players'), field: player_id}
        entity:
          type: foreign
          name: player
      - name: title_id
        description: プレイされたタイトル。
        data_type: varchar
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('dim_titles'), field: title_id}
        entity:
          type: foreign
          name: title
      - name: platform_id
        description: セッションが実行されたストアフロント。
        data_type: varchar
        data_tests:
          - not_null
        entity:
          type: foreign
          name: platform
      - name: release_id_in_effect
        description: セッション開始時点でタイトルに適用されていたリリース。リリース前の場合はnull。
        data_type: varchar
        data_tests:
          - relationships:
              arguments:
                to: ref('fct_releases')
                field: release_id
              config: {where: "release_id_in_effect is not null"}

      - name: session_start_at
        description: セッション開始時刻（UTC）。
        data_type: timestamp_ntz
        data_tests: [not_null]
      - name: session_end_at
        description: セッション終了時刻（UTC）。終了前にクライアントがクラッシュした場合はnull。
        data_type: timestamp_ntz
      - name: session_date
        description: セッション開始日の暦日。
        data_type: date
        dimension:
          type: time
          name: session_day
        granularity: day
      - name: session_month
        description: セッションの月。月次エンゲージメントマートの粒度。
        data_type: date
      - name: session_week
        description: セッションの週（月曜日始まり）。
        data_type: date
      - name: duration_seconds
        description: 元のセッション時間（秒）。クラッシュセッションではnull。
        data_type: integer
      - name: session_duration_minutes
        description: セッション時間（分）。
        data_type: number(12,2)
      - name: is_valid_session
        description: エンゲージメント指標に使用する正常なセッションの場合にtrue。クラッシュとアイドル状態の外れ値を除外。
        data_type: boolean
        dimension:
          type: categorical
      - name: levels_completed
        description: セッション中に完了したレベルまたはマッチ数。
        data_type: integer
      - name: crashed_flag
        description: クライアントがクラッシュを報告した場合にtrue。
        data_type: boolean
      - name: network_type
        description: 使用ネットワーク。wifi、cellular、ethernetのいずれか。
        data_type: varchar
        dimension:
          type: categorical
      - name: device_model
        description: デバイスまたはハードウェアのモデル。
        data_type: varchar
      - name: app_version
        description: セッションから報告されたクライアントバージョン。
        data_type: varchar
      - name: release_version_in_effect
        description: セッション時点で適用されていたリリースのセマンティックバージョン。
        data_type: varchar
      - name: country_code
        description: セッション発生国の整形済み国コード。
        data_type: varchar
      - name: registration_cohort_month
        description: プレイヤーの登録コホート月。コホート別エンゲージメント分析用に保持する。
        data_type: date
        dimension:
          type: time
        granularity: month
      - name: week_offset_from_registration
        description: 登録からセッションまでの経過週数（0は登録週）。
        data_type: integer
        dimension:
          type: categorical
      - name: is_weekend_session
        description: セッションが土曜日または日曜日に開始した場合にtrue。
        data_type: boolean
    semantic_model:
      enabled: true
      name: fct_play_sessions
    agg_time_dimension: session_day
    metrics:
      - name: monthly_active_players
        label: 月間アクティブプレイヤー数
        description: 期間中にアクティブだったユニークプレイヤー数（月間アクティブプレイヤー数は月単位でクエリしてください）。
        type: simple
        agg: count_distinct
        expr: player_id
      - name: cohort_players
        label: コホートプレイヤー数
        description: ユニークプレイヤー数（リテンションの分母）。
        type: simple
        agg: count_distinct
        expr: player_id
      - name: week4_returned_players
        label: 登録後4週目の復帰プレイヤー数
        description: 登録後4週目にアクティブだったユニークプレイヤー数。
        type: simple
        filter: "{{ Dimension('session__week_offset_from_registration') }} = 4"
        agg: count_distinct
        expr: player_id
      - name: session_count
        label: プレイセッション数
        description: プレイセッションの数。
        agg: count
        expr: session_id
        type: simple
        hidden: true
      - name: valid_session_count
        label: 有効セッション数
        description: クラッシュとアイドル状態の外れ値を除外したセッション数。
        agg: sum
        expr: "case when is_valid_session then 1 else 0 end"
        type: simple
        hidden: true
      - name: play_minutes
        label: 有効プレイ時間（分）
        description: 有効なプレイ時間の合計（分）。
        agg: sum
        expr: session_duration_minutes
        type: simple
        hidden: true
      - name: week_4_retention
        label: 登録後4週目リテンション
        description: 登録後4週目にアクティブだったプレイヤー数を全プレイヤー数で割った割合。
        type: ratio
        numerator: week4_returned_players
        denominator: cohort_players

  # ------------------------------------------------------------------------------------
  - name: fct_transactions
    description: >-
      1行が1取引を表し、符号付き純額とスタジオ純収益を持つ。返金とチャージバックは
      元データでは正数だが、ここでは負数。transaction_atはUTC。取引ファクト上の収益化セマンティックモデル。
    config:
      contract:
        enforced: true
    columns:
      - name: transaction_id
        description: 取引識別子（主キー）。
        data_type: varchar
        constraints: [type: not_null]
        data_tests: [unique, not_null]
        entity:
          type: primary
          name: transaction
      - name: player_id
        description: 取引を行ったプレイヤー。
        data_type: varchar
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('dim_players'), field: player_id}
        entity:
          type: foreign
          name: player
      - name: title_id
        description: 取引が帰属するタイトル。
        data_type: varchar
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('dim_titles'), field: title_id}
        entity:
          type: foreign
          name: title
      - name: platform_id
        description: 取引が決済されたストアフロント。
        data_type: varchar
        data_tests:
          - not_null
        entity:
          type: foreign
          name: platform
      - name: sku_id
        description: 購入されたSKU。プレミアム本体購入ではnull。
        data_type: varchar
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_skus')
                field: sku_id
              config: {where: "sku_id is not null"}
      - name: transaction_at
        description: UTCの取引タイムスタンプ（America/New_Yorkから変換）。
        data_type: timestamp_ntz
        data_tests: [not_null]
      - name: transaction_at_local
        description: 監査用に保持するAmerica/New_York現地時刻の元の取引タイムスタンプ。
        data_type: timestamp_ntz
      - name: transaction_date
        description: 取引の暦日（UTC）。
        data_type: date
        dimension:
          type: time
          name: transaction_day
        granularity: day
      - name: transaction_month
        description: 取引月。月次収益マートの粒度。
        data_type: date
      - name: transaction_type
        description: premium_purchase、iap、season_pass、dlc、refund、chargebackのいずれか。
        data_type: varchar
        data_tests:
          - accepted_values:
              arguments:
                values: ['premium_purchase', 'iap', 'season_pass', 'dlc', 'refund', 'chargeback']
        dimension:
          type: categorical
      - name: revenue_stream_group
        description: ストリーム別財務分析用の分類。live_service、catalog、reversalのいずれか。
        data_type: varchar
        data_tests:
          - accepted_values:
              arguments:
                values: ['live_service', 'catalog', 'reversal']
        dimension:
          type: categorical

      - name: is_live_service_revenue
        description: iap、season_pass、およびそれらの取消取引の場合にtrue。ライブサービス収益の基礎。
        data_type: boolean
      - name: is_first_purchase
        description: プレイヤーの初回獲得取引の場合にtrue。
        data_type: boolean
      - name: currency_code
        description: プレイヤーに請求した通貨。
        data_type: varchar
      - name: payment_method
        description: 使用された決済手段。
        data_type: varchar
      - name: gross_amount_usd
        description: 売上総額（USD、販売は正数）。
        data_type: number(12,2)
      - name: platform_fee_usd
        description: 取引から差し引かれたストアフロント手数料。
        data_type: number(12,2)
      - name: net_amount_usd
        description: 符号付き純額。返金とチャージバックは負数。
        data_type: number(12,2)
      - name: studio_net_revenue_usd
        description: ストアフロント手数料控除後の符号付き収益。スタジオの認識収益。
        data_type: number(12,2)
    semantic_model:
      enabled: true
      name: fct_transactions
    agg_time_dimension: transaction_day
    metrics:
      - name: net_revenue
        label: 純収益（USD）
        description: すべての収益ストリームを対象とした純収益。返金とチャージバックを相殺済み。
        type: simple
        agg: sum
        expr: net_amount_usd
      - name: paying_players
        label: 課金プレイヤー数
        description: 純支出が正のユニークプレイヤー数。
        type: simple
        agg: count_distinct
        expr: "case when net_amount_usd > 0 then player_id end"
      - name: studio_net_revenue
        label: スタジオ純収益
        description: ストア手数料控除後の純収益。
        agg: sum
        expr: studio_net_revenue_usd
        type: simple
        hidden: true
      - name: gross_revenue
        label: 売上総額（USD）
        description: 取引総額（USD）。
        agg: sum
        expr: gross_amount_usd
        type: simple
        hidden: true
      - name: arppu
        label: 課金プレイヤー1人あたり平均純収益（USD）
        description: 課金プレイヤー1人あたりの平均純収益。
        type: ratio
        numerator: net_revenue
        denominator: paying_players
  - name: fct_high_scores
    description: >
      1行が1リーダーボード投稿を表す。不正フラグ付き投稿も保持・計上するがランキングから除外し、
      leaderboard_rankとscore_percentileは正当な行だけを対象とする。
    config:
      contract:
        enforced: true
    columns:
      - name: score_id
        description: 投稿識別子（主キー）。
        data_type: varchar
        constraints: [type: not_null]
        data_tests: [unique, not_null]
      - name: player_id
        description: スコアを投稿したプレイヤー。
        data_type: varchar
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('dim_players'), field: player_id}
      - name: title_id
        description: リーダーボードが属するタイトル。
        data_type: varchar
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('dim_titles'), field: title_id}
      - name: leaderboard_id
        description: スコアが投稿されたリーダーボード。
        data_type: varchar
      - name: score_value
        description: 投稿された元のスコア。
        data_type: number(38,0)
      - name: submitted_at
        description: 投稿タイムスタンプ（UTC）。
        data_type: timestamp_ntz
      - name: submitted_date
        description: 投稿の暦日。
        data_type: date
      - name: is_verified
        description: スコアがサーバー側検証を通過したか。
        data_type: boolean
      - name: flagged_for_cheating
        description: アンチチートが投稿を不審としてフラグ付けしたか。
        data_type: boolean
      - name: leaderboard_rank
        description: 正当な投稿におけるリーダーボード内順位（フラグ付き行はnull）。
        data_type: integer
      - name: score_percentile
        description: リーダーボードの正当な投稿におけるスコアのパーセンタイル（0〜1）。
        data_type: number(6,4)

  # ------------------------------------------------------------------------------------
  - name: fct_releases
    description: >
      1行が1リリースを表し、開発日数差分と、リリース前後10日間を比較したエンゲージメント差分
      （セッション、アクティブプレイヤー、クラッシュ率、セッション時間）を持つ。
      ライブ運用における「このリリースは改善したか悪化させたか」という分析に使用する。
    config:
      contract:
        enforced: true
    columns:
      - name: release_id
        description: リリース識別子（主キー）。
        data_type: varchar
        constraints: [type: not_null]
        data_tests: [unique, not_null]
      - name: title_id
        description: リリースが配信されたタイトル。
        data_type: varchar
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('dim_titles'), field: title_id}
      - name: app_version
        description: 配信されたセマンティックバージョン。
        data_type: varchar
      - name: released_at
        description: リリースタイムスタンプ（UTC）。
        data_type: timestamp_ntz
      - name: released_date
        description: リリースの暦日。
        data_type: date
      - name: release_type
        description: major、minor、hotfix、content_drop、eventのいずれかのリリース種別。
        data_type: varchar
        data_tests:
          - accepted_values:
              arguments:
                values: ['major', 'minor', 'hotfix', 'content_drop', 'event']

      - name: is_rollback
        description: リリースが以前のリリースをロールバックした場合にtrue。
        data_type: boolean
      - name: dev_days_estimated
        description: 予算として見積もった開発日数。
        data_type: integer
      - name: dev_days_actual
        description: 実際に費やした開発日数。
        data_type: integer
      - name: dev_days_variance
        description: 実績開発日数から見積開発日数を引いた差分。正数は予算超過を示す。
        data_type: integer
      - name: dev_days_variance_pct
        description: 見積に対する開発日数差分の割合。
        data_type: number(9,4)
      - name: is_over_budget
        description: リリースに見積以上の開発日数を要した場合にtrue。
        data_type: boolean
      - name: qa_bug_count
        description: リリースに紐づくQA起票バグ数。
        data_type: integer
      - name: sessions_10d_before
        description: リリース前10日間のタイトルのセッション数。
        data_type: integer
      - name: sessions_10d_after
        description: リリース後10日間のタイトルのセッション数。
        data_type: integer
      - name: session_count_delta
        description: リリース後からリリース前を引いたセッション数差分。主要なエンゲージメント変動。
        data_type: integer
      - name: active_players_10d_before
        description: リリース前10日間の重複しないアクティブプレイヤー数。
        data_type: integer
      - name: active_players_10d_after
        description: リリース後10日間の重複しないアクティブプレイヤー数。
        data_type: integer
      - name: crash_rate_10d_before
        description: リリース前10日間にクラッシュしたセッションの割合。
        data_type: number(6,4)
      - name: crash_rate_10d_after
        description: リリース後10日間にクラッシュしたセッションの割合。急上昇は不良ビルドの兆候。
        data_type: number(6,4)
      - name: avg_minutes_10d_before
        description: リリース前10日間の有効セッション平均時間（分）。
        data_type: number(12,2)
      - name: avg_minutes_10d_after
        description: リリース後10日間の有効セッション平均時間（分）。
        data_type: number(12,2)
      - name: made_engagement_worse
        description: >
          リリースによりセッション数が減少するか、クラッシュ率が5ポイント超上昇した場合にtrue。
          Engine 5のメジャーリリースのような劣化を検出するフラグ。
        data_type: boolean

unit_tests:
  - name: test_fct_high_scores_excludes_flagged_cheaters_from_rank
    description: >
      Cheat-flagged submissions are retained in the output but excluded from
      leaderboard_rank/score_percentile — ranks and percentiles are computed only among
      legitimate rows on each leaderboard.
    model: fct_high_scores
    given:
      - input: ref('stg_high_scores')
        rows:
          - {score_id: s1, player_id: p1, title_id: t1, leaderboard_id: lb1, score_value: 100, submitted_at: "2026-01-01 00:00:00", is_verified: true, flagged_for_cheating: false}
          - {score_id: s2, player_id: p2, title_id: t1, leaderboard_id: lb1, score_value: 90, submitted_at: "2026-01-01 00:00:00", is_verified: true, flagged_for_cheating: false}
          - {score_id: s3, player_id: p3, title_id: t1, leaderboard_id: lb1, score_value: 200, submitted_at: "2026-01-01 00:00:00", is_verified: true, flagged_for_cheating: true}
          - {score_id: s4, player_id: p4, title_id: t1, leaderboard_id: lb1, score_value: 80, submitted_at: "2026-01-01 00:00:00", is_verified: true, flagged_for_cheating: false}
    expect:
      rows:
        - {score_id: s1, leaderboard_rank: 1, score_percentile: 1.0}
        - {score_id: s2, leaderboard_rank: 2, score_percentile: 0.5}
        - {score_id: s3, leaderboard_rank: null, score_percentile: null}
        - {score_id: s4, leaderboard_rank: 3, score_percentile: 0.0}
